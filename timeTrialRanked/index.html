<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Trial Ranked</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a class="back-button" href="../hub/">BACK TO HUB</a>
    <a class="kofi-button" href="https://ko-fi.com/tchongass" target="_blank" rel="noopener noreferrer">CONSIDER GIVING ME MONEY</a>
    <main class="page-shell">
        <header class="hero">
            <h1>TIME TRIAL</h1>
        </header>

        <div id="api-status" class="api-status" role="status" hidden></div>

        <section class="mc-panel leaderboard-panel">
            <div class="panel-heading">
                <div><span class="panel-kicker">AVERAGE TIME</span><h2><img class="panel-icon" src="https://assets.mcasset.cloud/1.21.4/assets/minecraft/textures/item/totem_of_undying.png" alt="" width="26" height="26">LEADERBOARD</h2></div>
                <label class="search-field"><span>SEARCH</span><input id="player-search" type="search" placeholder="Player name" autocomplete="off"></label>
            </div>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>RANK</th><th>PLAYER</th><th>AVG. TIME</th><th>BEST</th></tr></thead>
                    <tbody id="leaderboard-body"></tbody>
                </table>
            </div>
            <p id="empty-ranking" class="empty-state" hidden>No players match that search.</p>
        </section>

        <section class="mc-panel best-times-panel">
            <div class="panel-heading"><div><h2><img class="panel-icon" src="https://assets.mcasset.cloud/26.3/assets/minecraft/textures/item/clock_11.png" alt="" width="26" height="26">BEST TIMES</h2></div></div>
            <div id="best-times" class="best-times-list"></div>
        </section>

        <section class="mc-panel history-panel">
            <div class="panel-heading"><div><h2><img class="panel-icon" src="https://assets.mcasset.cloud/26.3/assets/minecraft/textures/item/compass_01.png" alt="" width="26" height="26">RECENT RUNS</h2></div></div>
            <div id="recent-runs" class="run-list"></div>
        </section>

        <div id="player-backdrop" class="player-backdrop" hidden></div>
        <section id="player-panel" class="mc-panel player-panel" role="dialog" aria-modal="true" aria-label="Player details" hidden>
            <button id="close-player" class="close-button" type="button">CLOSE</button>
            <div id="player-content"></div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
